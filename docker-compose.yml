services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  backend:
    build: ./backend
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/lms
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      CLIENT_URL: http://localhost:8080
    depends_on: [mongo]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  mongo-data:
